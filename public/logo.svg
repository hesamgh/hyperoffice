<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="HyperOffice">
  <defs>
    <linearGradient id="a-bg" x1="64" y1="40" x2="448" y2="472" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9aafff"/>
      <stop offset="0.45" stop-color="#6176f4"/>
      <stop offset="1" stop-color="#3849c4"/>
    </linearGradient>
    <linearGradient id="a-inset" x1="140" y1="110" x2="370" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0b1026" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="a-beam" x1="170" y1="256" x2="400" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#e0e7ff"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <radialGradient id="a-glow" cx="340" cy="256" r="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#bfdbfe" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#bfdbfe" stop-opacity="0"/>
    </radialGradient>
    <filter id="a-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#09090f"/>
  <rect x="48" y="48" width="416" height="416" rx="96" fill="url(#a-bg)"/>
  <rect x="56" y="56" width="400" height="400" rx="92" stroke="#fff" stroke-opacity="0.22" stroke-width="4"/>

  <rect x="108" y="108" width="296" height="296" rx="72" fill="url(#a-inset)"/>
  <path d="M140 144c52-30 180-30 232 0" stroke="#fff" stroke-opacity="0.4" stroke-width="8" stroke-linecap="round"/>

  <!-- Hyper orbit -->
  <path d="M158 188c42-48 154-48 196 0" stroke="#93c5fd" stroke-opacity="0.45" stroke-width="10" stroke-linecap="round"/>

  <ellipse cx="336" cy="256" rx="100" ry="62" fill="url(#a-glow)"/>

  <path d="M176 164v184M312 164v184" stroke="#1e1b4b" stroke-opacity="0.3" stroke-width="34" stroke-linecap="round" transform="translate(8 8)"/>
  <path d="M176 164v184M312 164v184" stroke="#fff" stroke-width="34" stroke-linecap="round"/>

  <g filter="url(#a-soft)">
    <path d="M176 256h186" stroke="url(#a-beam)" stroke-width="28" stroke-linecap="round"/>
    <path d="M348 222 400 256l-52 34" stroke="url(#a-beam)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
