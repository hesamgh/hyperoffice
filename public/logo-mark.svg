<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="m-bg" x1="4" y1="2" x2="44" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9aafff"/>
      <stop offset="0.45" stop-color="#6176f4"/>
      <stop offset="1" stop-color="#3849c4"/>
    </linearGradient>
    <linearGradient id="m-inset" x1="12" y1="9" x2="36" y2="39" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0b1026" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="m-beam" x1="16" y1="24" x2="40" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#e0e7ff"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <radialGradient id="m-glow" cx="33" cy="24" r="11" gradientUnits="userSpaceOnUse">
      <stop stop-color="#bfdbfe" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#bfdbfe" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- App tile -->
  <rect width="48" height="48" rx="13" fill="url(#m-bg)"/>
  <rect x="1" y="1" width="46" height="46" rx="12" stroke="#fff" stroke-opacity="0.22" stroke-width="1"/>

  <!-- Glass plane -->
  <rect x="8" y="8" width="32" height="32" rx="9" fill="url(#m-inset)"/>
  <path d="M12 12.5c5.5-3.2 18.5-3.2 24 0" stroke="#fff" stroke-opacity="0.4" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Soft orbit = hyper elevation -->
  <path d="M14 18c4.5-5.5 15.5-5.5 20 0" stroke="#93c5fd" stroke-opacity="0.45" stroke-width="1.4" stroke-linecap="round"/>

  <ellipse cx="32" cy="24" rx="10" ry="6" fill="url(#m-glow)"/>

  <!-- Depth shadow -->
  <path d="M16.5 15.5v17M29.5 15.5v17" stroke="#1e1b4b" stroke-opacity="0.3" stroke-width="3.6" stroke-linecap="round" transform="translate(0.7 0.7)"/>

  <!-- H pillars -->
  <path d="M16.5 15.5v17M29.5 15.5v17" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/>

  <!-- Hyper bar through H, then forward arrow tip -->
  <path d="M16.5 24h18" stroke="url(#m-beam)" stroke-width="3.1" stroke-linecap="round"/>
  <path d="M33.2 20.6 38.2 24l-5 3.4" stroke="url(#m-beam)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
